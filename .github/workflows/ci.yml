name: Testes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes financeiros, de mensagens e de QR Code
        run: npm test
      - name: TypeScript e build da montadora
        run: npm run build
      - name: Distribuição versionada em montadora/ está atualizada
        run: git diff --exit-code -- montadora
      - name: Navegador para os testes de interface
        run: npx playwright install --with-deps chromium
      - name: Testes de interface (calculadora, orçamentos e montadora)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
